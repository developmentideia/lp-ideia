name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Validar HTML e links internos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Validar HTML
        run: npm run validate

      - name: Verificar links internos
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --exclude-path node_modules './**/*.html'
          output: lychee/out.md
          fail: true
          failIfEmpty: false

      - name: Mostrar falhas de links como anotações
        if: failure()
        run: |
          if [ -f lychee/out.md ]; then
            grep -v '^\s*$' lychee/out.md | head -50 | while IFS= read -r linha; do echo "::error title=lychee::${linha}"; done
          else
            echo "::error title=lychee::relatório lychee/out.md não foi gerado"
          fi
